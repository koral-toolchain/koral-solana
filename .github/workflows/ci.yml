name: Product CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          path: .policy-base
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve checker identities from base and candidate data
        id: governance
        run: |
          python3 - <<'PYPINS'
          import json, os, re, subprocess
          from pathlib import Path
          candidate=json.loads(Path('config/governance.json').read_text())
          base=Path('.policy-base/config/governance.json')
          if base.exists():
              trusted=json.loads(base.read_text())['checkerPin']
          else:
              identity=subprocess.check_output(['git','-C','.policy-base','rev-parse','HEAD'],text=True).strip()
              assert identity=='dc2b96a9f9d572a74a1fea074a76721a51503f2c', 'Unrecognized governance bootstrap base'
              trusted='7ec0ab17c05940a676e91cc71037b349b4532629'
          proposed=candidate['checkerPin']
          assert all(re.fullmatch('[a-f0-9]{40}',value) for value in [trusted,proposed])
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('trusted='+trusted+'\nproposed='+proposed+'\n')
          PYPINS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: koral-toolchain/handbook
          ref: ${{ steps.governance.outputs.trusted }}
          path: .trusted-handbook
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: koral-toolchain/handbook
          ref: main
          path: .policy-records
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: koral-toolchain/handbook
          ref: ${{ steps.governance.outputs.proposed }}
          path: .handbook
          persist-credentials: false
      - name: Check owner-only contribution status and proposed message
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          EVENT_REF: ${{ github.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          if os.environ['EVENT']=='workflow_dispatch' and os.environ['EVENT_REF']!='refs/heads/main':
              raise SystemExit('Manual verification is main-only; PR policy checks must run on the PR event')
          if os.environ['EVENT'] == 'pull_request':
              if os.environ['PR_AUTHOR'] != 'tidemark-labs':
                  raise SystemExit('External contributions are currently closed')
              message = os.environ['PR_TITLE'] + '\n\n' + os.environ['PR_BODY']
          else:
              if os.environ['ACTOR'] != 'tidemark-labs':
                  raise SystemExit('Only the owner may start product verification')
              message = subprocess.check_output(['git', 'log', '-1', '--format=%B'], text=True)
          Path('/tmp/koral-message.txt').write_text(message)
          Path('/tmp/koral-policy-body.txt').write_text(os.environ['PR_BODY'] if os.environ['EVENT']=='pull_request' else message)
          PY
          python3 .trusted-handbook/tools/governance.py --product . --records .policy-records --base "$BASE_SHA" --head "$HEAD_SHA" --body-file /tmp/koral-policy-body.txt --repository "$GITHUB_REPOSITORY"
          git -C .policy-records merge-base --is-ancestor "${{ steps.governance.outputs.proposed }}" origin/main
          python3 .handbook/tools/policy.py commit --message-file /tmp/koral-message.txt
          python3 .handbook/tools/policy.py versions --repo .
          python3 -c 'import json; assert json.load(open(".handbook/config/engineering.json")) == json.load(open("config/engineering.json")), "Pinned engineering policy drift"'
  quality:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify reference-backed repository rules
        run: |
          python3 -m pip install --require-hashes -r tools/quality/requirements.txt
          npm ci --ignore-scripts --prefix tools/quality
          python3 tools/quality/check.py
          python3 -m unittest discover -s tools/quality -v
      - name: Prepare verified dependencies and positive quality checks
        run: python3 tools/quality/prepare.py --mode quality
      - name: Verify intentional rejections offline
        run: python3 tools/quality/probe.py
      - name: Verify restored positive quality state
        run: |
          ruff check tools
          ruff format --check tools
          node tools/quality/node_modules/prettier/bin/prettier.cjs --check 'testing/*.mjs' tools/quality/package.json tools/quality/package-lock.json config/engineering.json
          ./gradlew --no-daemon --offline spotlessCheck detekt :cli:test --tests '*ArchitectureTest'
      - name: Verify actual linked issue and PR explanations
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYPR'
          import os, re, subprocess
          from pathlib import Path
          body=os.environ['PR_BODY']
          Path('/tmp/koral-pr-body.txt').write_text(body)
          subprocess.run(['python3','tools/quality/check.py','--pr-body','/tmp/koral-pr-body.txt'],check=True)
          number=re.search(r'(?i)\b(?:refs|closes|fixes)\s+#([1-9][0-9]*)\b',body)[1]
          subprocess.run(['gh','api',f'repos/{os.environ["GH_REPO"]}/issues/{number}','--jq','if has("pull_request") then error("Link an issue, not a PR") else .number end'],check=True)
          PYPR
  unit:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/quality/prepare.py --mode unit
      - run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: candidate-cli
          path: |
            cli/build/distributions/*.tar
            cli/build/distributions/runtime-classpath.json
          if-no-files-found: error
          retention-days: 3
  sbf-integration:
    needs: unit
    uses: ./.github/workflows/native.yml
    with:
      java: '17'
      node: '22.22.3'
      mode: integration
  consumer-install:
    needs: unit
    uses: ./.github/workflows/native.yml
    with:
      java: '17'
      node: '22.22.3'
      mode: smoke
  compatibility:
    needs: unit
    uses: ./.github/workflows/native.yml
    with:
      java: '21'
      node: '24'
      mode: smoke
  required:
    if: ${{ always() }}
    needs: [policy, quality, unit, sbf-integration, consumer-install, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: koral-toolchain/handbook
          ref: 7ec0ab17c05940a676e91cc71037b349b4532629
          persist-credentials: false
      - name: Reject unsuccessful or missing required checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('/tmp/koral-results.json').write_text(os.environ['RESULTS'])
          PY
          python3 tools/policy.py gate --needs-file /tmp/koral-results.json
